<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Subject</title>
</head>
<!-- Inline styles and tables on purpose: many mail clients ignore <style> blocks and modern CSS layout. -->
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;">

                <tr>
                    <td style="background-color:#111827;color:#ffffff;padding:20px 24px;font-size:20px;font-weight:bold;border-radius:8px 8px 0 0;"
                        th:text="${storeName}">Store</td>
                </tr>

                <tr>
                    <td style="padding:28px 24px 8px 24px;">
                        <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;" th:text="${content.headline}">Headline</h1>
                        <p th:each="paragraph : ${content.paragraphs}"
                           style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#374151;"
                           th:text="${paragraph}">Paragraph</p>
                    </td>
                </tr>

                <tr th:if="${!#lists.isEmpty(content.items)}">
                    <td style="padding:8px 24px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px;">
                            <tr style="color:#6b7280;">
                                <th align="left" style="padding:8px 0;border-bottom:1px solid #e5e7eb;font-weight:normal;">Item</th>
                                <th align="center" style="padding:8px 0;border-bottom:1px solid #e5e7eb;font-weight:normal;">Qty</th>
                                <th align="right" style="padding:8px 0;border-bottom:1px solid #e5e7eb;font-weight:normal;">Price</th>
                                <th align="right" style="padding:8px 0;border-bottom:1px solid #e5e7eb;font-weight:normal;">Subtotal</th>
                            </tr>
                            <tr th:each="item : ${content.items}">
                                <td style="padding:10px 0;border-bottom:1px solid #f3f4f6;" th:text="${item.name}">Item</td>
                                <td align="center" style="padding:10px 0;border-bottom:1px solid #f3f4f6;" th:text="${item.quantity}">1</td>
                                <td align="right" style="padding:10px 0;border-bottom:1px solid #f3f4f6;white-space:nowrap;" th:text="${item.unitPrice}">EGP 0.00</td>
                                <td align="right" style="padding:10px 0;border-bottom:1px solid #f3f4f6;white-space:nowrap;" th:text="${item.subtotal}">EGP 0.00</td>
                            </tr>
                            <tr th:if="${content.total != null}">
                                <td colspan="3" align="right" style="padding:14px 0 0 0;font-weight:bold;">Total</td>
                                <td align="right" style="padding:14px 0 0 0;font-weight:bold;white-space:nowrap;" th:text="${content.total}">EGP 0.00</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr th:if="${!#lists.isEmpty(content.details)}">
                    <td style="padding:8px 24px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
                            <tr th:each="detail : ${content.details}">
                                <td style="padding:6px 12px 6px 0;color:#6b7280;white-space:nowrap;vertical-align:top;" th:text="${detail.label}">Label</td>
                                <td style="padding:6px 0;" th:text="${detail.value}">Value</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr th:if="${!#lists.isEmpty(content.shippingLines)}">
                    <td style="padding:16px 24px 8px 24px;font-size:14px;line-height:1.6;">
                        <div style="color:#6b7280;margin-bottom:4px;">Shipping to</div>
                        <div th:each="line : ${content.shippingLines}" th:text="${line}">Address line</div>
                    </td>
                </tr>

                <tr th:if="${content.actionUrl != null}">
                    <td style="padding:20px 24px 8px 24px;">
                        <a th:href="${content.actionUrl}" th:text="${content.actionLabel}"
                           style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:6px;font-weight:bold;font-size:15px;">Open</a>
                    </td>
                </tr>

                <tr>
                    <td style="padding:24px;font-size:12px;line-height:1.5;color:#9ca3af;border-top:1px solid #f3f4f6;">
                        You received this email because of activity on your <span th:text="${storeName}">Store</span> account.
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
