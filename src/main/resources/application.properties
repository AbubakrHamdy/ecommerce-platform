spring.application.name=ecommerce-platform

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

server.port=3330

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ecommerce-platform
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

app.password-reset.token-ttl=30m
app.password-reset.reset-url=${FRONTEND_URL:http://localhost:4200}/reset-password

app.mail.from=no-reply@ecommerce.local
