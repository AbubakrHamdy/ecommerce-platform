spring.application.name=ecommerce-platform

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

spring.data.web.pageable.max-page-size=100

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.port=3330

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ecommerce-platform
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

app.password-reset.token-ttl=30m
app.password-reset.reset-url=${FRONTEND_URL:http://localhost:4200}/reset-password

app.mail.from=no-reply@ecommerce.local

app.cache.ttl=10m

# ISO 3166 country of this store. Currency and payment providers are derived from it
# (override with app.store.currency / app.store.payment-providers if needed).
app.store.country=${STORE_COUNTRY:EG}

# Stripe requires a Checkout Session to live at least 30 minutes, hence 31.
app.payments.session-ttl=31m
app.payments.success-url=${FRONTEND_URL:http://localhost:4200}/orders/{orderId}?payment=success
app.payments.cancel-url=${FRONTEND_URL:http://localhost:4200}/orders/{orderId}?payment=cancelled

# A provider is offered only when its credentials are set. Never commit real keys.
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payments.stripe.api-base=${STRIPE_API_BASE:}

app.orders.payment-timeout=30m
app.orders.expiry-check-interval=60s

app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.bucket=${STORAGE_BUCKET:product-images}
app.storage.public-url=${STORAGE_PUBLIC_URL}
app.storage.create-bucket=false
